<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balcão | Controle de Entregas</title>
  <script>
    window.API_BASE = 'https://controle-entregas-owfe.onrender.com';
  </script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --waiting: #f8fafc;
      --route: #eff6ff;
      --done: #f0fdf4;
      --drink: #fff7ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      color: var(--text);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .title h1 {
      margin: 0;
      font-size: 28px;
    }

    .title p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: #fff;
    }

    .b-waiting { color: #b45309; background: #fffbeb; }
    .b-route { color: #1d4ed8; background: #eff6ff; }
    .b-done { color: #15803d; background: #f0fdf4; }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
    }

    .checkline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 14px;
      color: var(--text);
      font-size: 14px;
    }

    .checkline input {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: 0 0 auto;
    }

    .radio-group {
      display: grid;
      gap: 10px;
      margin-top: 8px;
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: #f8fafc;
    }

    .radio-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .radio-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      flex: 0 0 auto;
    }

    button {
      cursor: pointer;
      border: 0;
      background: linear-gradient(90deg, #2563eb, #0ea5e9);
      color: #fff;
      font-weight: 800;
      transition: transform .12s ease, opacity .12s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .orders {
      display: grid;
      gap: 14px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .order-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      background: var(--card);
      border-left: 8px solid transparent;
    }

    .order-card.status-aguardando {
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      border-left-color: #f59e0b;
    }

    .order-card.status-em_rota {
      background: linear-gradient(180deg, #ffffff, #eff6ff);
      border-left-color: #2563eb;
    }

    .order-card.status-entregue {
      background: linear-gradient(180deg, #ffffff, #f0fdf4);
      border-left-color: #16a34a;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .order-name {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .pill.warn { background: #fffbeb; color: #a16207; }
    .pill.blue { background: #eff6ff; color: #1d4ed8; }
    .pill.green { background: #f0fdf4; color: #15803d; }
    .pill.gray { background: #f8fafc; color: #475569; }

    .empty {
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, 0.5);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      background: #fff;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <div class="title">
        <h1>Balcão · Controle de Entregas</h1>
        <p>Lançamento do pedido e acompanhamento em tempo real.</p>
      </div>
      <div class="badge b-route" id="connectionStatus">Conectando...</div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>Novo Pedido</h2>

        <form id="orderForm">
          <div class="field">
            <label for="customer_name">Nome do Cliente</label>
            <input id="customer_name" name="customer_name" type="text" placeholder="Ex.: João Silva" required />
          </div>

          <div class="field">
            <label for="initial_payment_method">Forma de Pagamento Inicial</label>
            <select id="initial_payment_method" name="initial_payment_method" required>
              <option value="">Selecione</option>
              <option>Dinheiro</option>
              <option>Cartão</option>
              <option>Pix</option>
            </select>
          </div>

          <div id="cashChangeBox" style="display:none;">
            <label style="display:block; margin-bottom:8px; color:var(--muted); font-size:14px; font-weight:600;">
              Vai precisar de troco?
            </label>
            <div class="radio-group">
              <label class="radio-row">
                <input type="radio" name="needs_change" value="sim" />
                Sim, vai precisar de troco
              </label>
              <label class="radio-row">
                <input type="radio" name="needs_change" value="nao" checked />
                Não precisa de troco
              </label>
            </div>
          </div>

          <div class="checkline">
            <input id="has_drink" name="has_drink" type="checkbox" />
            <label for="has_drink">Contém bebida</label>
          </div>

          <button type="submit">Lançar Pedido</button>
        </form>
      </section>

      <section class="panel">
        <h2>Pedidos do Dia</h2>
        <div class="orders" id="ordersContainer"></div>
      </section>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
