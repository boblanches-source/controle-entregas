<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balcão | Controle de Entregas</title>
  <script>
    window.API_BASE = 'https://controle-entregas-owfe.onrender.com';
  </script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --waiting: #fffaf0;
      --route: #eff6ff;
      --done: #f0fdf4;
      --paid: #ecfdf5;
      --delivery: #fff7ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title h1 {
      margin: 0;
      font-size: 28px;
    }

    .title p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    input, select, textarea, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
    }

    button {
      cursor: pointer;
      border: 0;
      background: linear-gradient(90deg, #2563eb, #0ea5e9);
      color: #fff;
      font-weight: 800;
      transition: transform .12s ease, opacity .12s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .btn-secondary {
      background: #334155;
    }

    .btn-green {
      background: linear-gradient(90deg, #16a34a, #22c55e);
    }

    .btn-orange {
      background: linear-gradient(90deg, #ea580c, #f59e0b);
    }

    .btn.edit {
      background: linear-gradient(90deg, #7c3aed, #8b5cf6);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid var(--line);
      background: #fff;
      white-space: nowrap;
    }

    .b-waiting { color: #b45309; background: #fff7ed; }
    .b-route { color: #1d4ed8; background: #eff6ff; }
    .b-done { color: #15803d; background: #f0fdf4; }
    .b-paid { color: #047857; background: #ecfdf5; }

    .choice-grid {
      display: grid;
      gap: 10px;
    }

    .choice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f8fafc;
      cursor: pointer;
      user-select: none;
      transition: all .12s ease;
      font-weight: 700;
    }

    .choice input {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: 0 0 auto;
    }

    .choice.is-selected {
      border-color: transparent;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
    }

    .choice.green.is-selected {
      background: #ecfdf5;
      color: #166534;
    }

    .choice.orange.is-selected {
      background: #fff7ed;
      color: #9a3412;
    }

    .choice.blue.is-selected {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .choice.purple.is-selected {
      background: #f5f3ff;
      color: #6b21a8;
    }

    .edit-box, .cash-box {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.9);
    }

    .edit-grid, .cash-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .edit-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .summary-card .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .summary-card .value {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.1;
    }

    .summary-card .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .orders {
      display: grid;
      gap: 14px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .order-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      background: var(--card);
      border-left: 8px solid transparent;
    }

    .order-card.status-aguardando {
      background: linear-gradient(180deg, #ffffff, #fffaf0);
      border-left-color: #f59e0b;
    }

    .order-card.status-em_rota {
      background: linear-gradient(180deg, #ffffff, #eff6ff);
      border-left-color: #2563eb;
    }

    .order-card.status-entregue {
      background: linear-gradient(180deg, #ffffff, #f0fdf4);
      border-left-color: #16a34a;
    }

    .order-card.paid-true {
      border-left-color: #16a34a;
    }

    .order-card.method-dinheiro {
      background: linear-gradient(180deg, #ffffff, #fff7ed);
    }

    .order-card.method-cartao {
      background: linear-gradient(180deg, #ffffff, #eff6ff);
    }

    .order-card.method-pix {
      background: linear-gradient(180deg, #ffffff, #f5f3ff);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .order-name {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .pill.warn { background: #fff7ed; color: #9a3412; }
    .pill.blue { background: #eff6ff; color: #1d4ed8; }
    .pill.green { background: #f0fdf4; color: #166534; }
    .pill.gray { background: #f8fafc; color: #475569; }
    .pill.purple { background: #f5f3ff; color: #6b21a8; }

    .empty {
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, 0.5);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      background: #fff;
    }

    .order-notes {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
      color: #334155;
      font-size: 13px;
      line-height: 1.5;
    }

    .summary-print {
      display: none;
    }

    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media print {
      @page {
        size: 58mm auto;
        margin: 2mm;
      }

      body {
        background: #fff !important;
        color: #000 !important;
      }

      .no-print {
        display: none !important;
      }

      .summary-print {
        display: block !important;
        width: 58mm;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10pt;
        color: #000;
      }

      .summary-print h1 {
        font-size: 12pt;
        margin: 0 0 6px;
        text-align: center;
      }

      .summary-print .line {
        border-top: 1px dashed #000;
        margin: 6px 0;
      }

      .summary-print .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 2px 0;
        break-inside: avoid;
      }

      .summary-print .muted {
        font-size: 9pt;
      }
    }
  </style>
</head>
<body>
  <main class="container no-print">
    <div class="header">
      <div class="title">
        <h1>Balcão · Controle de Entregas</h1>
        <p>Pedidos, pagamentos, observações e resumo financeiro do turno.</p>
      </div>
      <div class="header-actions">
        <div class="badge b-route" id="connectionStatus">Conectando...</div>
        <button id="printSummaryBtn" class="btn btn-green" style="width:auto; padding:10px 14px;">Imprimir Resumo 58mm</button>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>Novo Pedido</h2>

        <form id="orderForm">
          <div class="field">
            <label for="customer_name">Nome do Cliente</label>
            <input id="customer_name" name="customer_name" type="text" placeholder="Ex.: João Silva" required />
          </div>

          <div class="field">
            <label for="order_value">Valor do Pedido</label>
            <input id="order_value" name="order_value" type="number" step="0.01" min="0" placeholder="Ex.: 35,90" required />
          </div>

          <div class="field">
            <label for="initial_payment_method">Forma de Pagamento</label>
            <select id="initial_payment_method" name="initial_payment_method" required>
              <option value="">Selecione</option>
              <option>Dinheiro</option>
              <option>Cartão</option>
              <option>Pix</option>
            </select>
          </div>

          <div class="field">
            <label>Pagamento</label>
            <div class="choice-grid" id="paidAtCounterGroup">
              <label class="choice green" data-choice="paid-true">
                <input type="radio" name="paid_at_counter" value="1" />
                <span>Já está pago no balcão</span>
              </label>
              <label class="choice orange" data-choice="paid-false">
                <input type="radio" name="paid_at_counter" value="0" checked />
                <span>Vai pagar na entrega</span>
              </label>
            </div>
          </div>

          <div id="cashChangeBox" style="display:none;" class="field">
            <label>Se for dinheiro, vai precisar de troco?</label>
            <div class="choice-grid" id="needsChangeGroup">
              <label class="choice blue" data-choice="needs-true">
                <input type="radio" name="needs_change" value="sim" />
                <span>Sim, precisa de troco</span>
              </label>
              <label class="choice purple" data-choice="needs-false">
                <input type="radio" name="needs_change" value="nao" checked />
                <span>Não precisa de troco</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label for="has_drink">Contém bebida?</label>
            <div class="choice-grid">
              <label class="choice blue" data-choice="drink">
                <input id="has_drink" name="has_drink" type="checkbox" />
                <span>Sim, contém bebida</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label for="observations">Observações do pedido</label>
            <textarea id="observations" name="observations" placeholder="Ex.: entregar no portão azul, referência da casa, observação de entrega..."></textarea>
          </div>

          <button type="submit">Lançar Pedido</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Resumo do Turno</h2>
          <span class="badge b-paid" id="summaryUpdatedBadge">Atualizado em tempo real</span>
        </div>
        <div class="summary-grid" id="summaryCards"></div>
      </section>

      <section class="panel" style="grid-column: 1 / -1;">
        <h2>Pedidos do Dia</h2>
        <div class="orders" id="ordersContainer"></div>
      </section>
    </div>
  </main>

  <template id="summaryPrintTemplate">
    <div class="summary-print">
      <h1>Bob Lanches</h1>
      <div class="muted" style="text-align:center;">Resumo do Turno</div>
      <div class="line"></div>
      <div class="row"><strong>Total pedidos</strong><span id="sp-total-orders"></span></div>
      <div class="row"><strong>Entregues</strong><span id="sp-total-deliveries"></span></div>
      <div class="row"><strong>Total recebido</strong><span id="sp-total-received"></span></div>
      <div class="row"><strong>Pago no balcão</strong><span id="sp-paid-counter"></span></div>
      <div class="row"><strong>Na entrega</strong><span id="sp-paid-delivery"></span></div>
      <div class="line"></div>
      <div class="row"><strong>Dinheiro</strong><span id="sp-money"></span></div>
      <div class="row"><strong>Cartão</strong><span id="sp-card"></span></div>
      <div class="row"><strong>Pix</strong><span id="sp-pix"></span></div>
      <div class="line"></div>
      <div class="muted" style="text-align:center;">Fechado em tempo real</div>
    </div>
  </template>

  <script src="./app.js"></script>
</body>
</html>
