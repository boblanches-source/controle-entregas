<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balcão | Controle de Entregas</title>
  <script>
    window.API_BASE = 'http://localhost:3000';
  </script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --info: #38bdf8;
      --done: #64748b;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0b1220, #111827);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .title h1 {
      margin: 0;
      font-size: 28px;
    }

    .title p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    .panel {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0b1220;
      color: var(--text);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #60a5fa;
    }

    .checkline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .checkline input {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    button {
      cursor: pointer;
      border: 0;
      background: linear-gradient(90deg, #2563eb, #22c55e);
      font-weight: 700;
    }

    .status-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .b-waiting { background: rgba(245, 158, 11, .18); color: #fbbf24; }
    .b-route { background: rgba(56, 189, 248, .18); color: #38bdf8; }
    .b-done { background: rgba(100, 116, 139, .18); color: #cbd5e1; }

    .orders {
      display: grid;
      gap: 14px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .order-card {
      background: rgba(31, 41, 55, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 16px;
      padding: 14px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .order-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .order-actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .order-actions button {
      width: auto;
      padding: 10px 14px;
    }

    .btn-secondary {
      background: #334155;
    }

    .btn-success {
      background: #16a34a;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, 0.3);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <div class="title">
        <h1>Balcão · Controle de Entregas</h1>
        <p>Lançamento do pedido e acompanhamento em tempo real.</p>
      </div>
      <div class="badge b-route" id="connectionStatus">Conectando...</div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>Novo Pedido</h2>

        <form id="orderForm">
          <div class="field">
            <label for="customer_name">Nome do Cliente</label>
            <input id="customer_name" name="customer_name" type="text" placeholder="Ex.: João Silva" required />
          </div>

          <div class="field">
            <label for="initial_payment_method">Forma de Pagamento Inicial</label>
            <select id="initial_payment_method" name="initial_payment_method" required>
              <option value="">Selecione</option>
              <option>Dinheiro</option>
              <option>Cartão</option>
              <option>Pix</option>
            </select>
          </div>

          <div class="checkline">
            <input id="has_drink" name="has_drink" type="checkbox" />
            <label for="has_drink">Contém bebida</label>
          </div>

          <button type="submit">Lançar Pedido</button>
        </form>
      </section>

      <section class="panel">
        <h2>Pedidos do Dia</h2>
        <div class="orders" id="ordersContainer"></div>
      </section>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
