<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motoboy | Entregas V3</title>
  <script>
    window.API_BASE = 'https://controle-entregas-owfe.onrender.com';
  </script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-2: #0f172a;
      --card: #ffffff;
      --card-dark: #111827;
      --line: #dbe4f0;
      --text: #0f172a;
      --text-dark: #e5e7eb;
      --muted: #64748b;
      --muted-dark: #94a3b8;
      --accent: #2563eb;
      --success: #16a34a;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 18px;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fff, #f8fafc);
      color: var(--text);
      transition: background .2s ease, color .2s ease;
    }

    body.dark-mode {
      background: linear-gradient(180deg, #020617, #0f172a);
      color: var(--text-dark);
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding: 16px 18px;
      border-radius: 22px;
      background: #fff;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }

    body.dark-mode .topbar {
      background: #0f172a;
      border-color: rgba(148,163,184,.18);
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .sub {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    body.dark-mode .sub { color: var(--muted-dark); }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
    }

    .badge.online { background: #ecfdf5; color: #166534; border-color: #bbf7d0; }
    .badge.offline { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    body.dark-mode .badge { background: #111827; color: var(--text-dark); border-color: rgba(148,163,184,.18); }

    .toggle-btn {
      width: auto;
      border: 0;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
      background: #0f172a;
      color: white;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    body.dark-mode .panel {
      background: #0f172a;
      border-color: rgba(148,163,184,.18);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .panel h2 {
      margin: 0;
      font-size: 17px;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: linear-gradient(90deg, #2563eb, #0ea5e9);
      width: 100%;
    }

    .btn.secondary { background: #e2e8f0; color: #0f172a; }
    .btn.success { background: #16a34a; }
    .btn.warn { background: #d97706; }
    .btn.danger { background: #ef4444; }

    body.dark-mode .btn.secondary { background: #334155; color: #fff; }

    .orders {
      display: grid;
      gap: 12px;
    }

    .order-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    body.dark-mode .order-card {
      background: #111827;
      border-color: rgba(148,163,184,.18);
      color: var(--text-dark);
    }

    .order-card.waiting { border-left: 7px solid #f59e0b; }
    .order-card.route { border-left: 7px solid #0ea5e9; }
    .order-card.done { border-left: 7px solid #16a34a; }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
      margin-bottom: 8px;
    }

    .customer {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    body.dark-mode .meta { color: var(--muted-dark); }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid transparent;
    }

    .pill.waiting { background: #fffbeb; color: #92400e; border-color: #fde68a; }
    .pill.route { background: #ecfeff; color: #155e75; border-color: #a5f3fc; }
    .pill.done { background: #ecfdf5; color: #166534; border-color: #bbf7d0; }
    .pill.paid { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .pill.cash { background: #fefce8; color: #a16207; border-color: #fde68a; }

    .notes {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 14px;
    }

    body.dark-mode .notes {
      background: #0b1220;
      border-color: rgba(148,163,184,.18);
      color: #e5e7eb;
    }

    .actions {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .finish-box {
      margin-top: 10px;
      padding: 12px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    body.dark-mode .finish-box {
      background: #0b1220;
      border-color: rgba(148,163,184,.18);
    }

    .field { margin-bottom: 10px; }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    body.dark-mode .field label { color: var(--text-dark); }

    select, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 12px 14px;
      font-size: 15px;
    }

    body.dark-mode select,
    body.dark-mode input {
      background: #020617;
      color: var(--text-dark);
      border-color: rgba(148,163,184,.2);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    body.dark-mode .hint { color: var(--muted-dark); }

    .history {
      display: grid;
      gap: 10px;
    }

    .history-item {
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px 14px;
      font-size: 14px;
    }

    body.dark-mode .history-item {
      background: #111827;
      border-color: rgba(148,163,184,.18);
      color: #e5e7eb;
    }

    .empty {
      border: 1px dashed #cbd5e1;
      border-radius: 18px;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      background: #fff;
    }

    body.dark-mode .empty {
      background: #0f172a;
      border-color: rgba(148,163,184,.18);
      color: var(--muted-dark);
    }

    .summary-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      background: #dbeafe;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    body.dark-mode .summary-pill {
      background: rgba(30,64,175,.25);
      color: #bfdbfe;
      border-color: rgba(59,130,246,.3);
    }

    @media (max-width: 760px) {
      .topbar, .panel-head, .order-top { flex-direction: column; align-items: stretch; }
      .badges { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <h1>Motoboy · Entregas V3</h1>
        <p class="sub">Modo leve para entregas, sem resumo financeiro.</p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <button id="toggleThemeBtn" class="toggle-btn" type="button">Modo escuro</button>
        <div id="connectionStatus" class="badge offline">Conectando...</div>
      </div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2>Pedidos em tempo real</h2>
        <span class="summary-pill" id="activeCount">0 pedidos ativos</span>
      </div>
      <div id="ordersContainer" class="orders"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Últimas entregas</h2>
        <button id="refreshBtn" class="btn secondary" style="width:auto; padding:10px 12px;">Atualizar</button>
      </div>
      <div id="historyContainer" class="history"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
